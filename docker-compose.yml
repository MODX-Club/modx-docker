services:
  nginx:
    image: nginx:alpine
    container_name: modx-nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - modx-network
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: ./php-fpm
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: modx-php
    volumes:
      - ./www:/var/www/html
      - ./.env:/project/.env:ro
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-modx}
      MYSQL_USER: ${MYSQL_USER:-modx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modx}
    networks:
      - modx-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: modx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-modx}
      MYSQL_USER: ${MYSQL_USER:-modx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modx}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - modx-network
    ports:
      - "3306:3306"

  pma:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: ${MYSQL_HOST:-mysql}
      PMA_PORT: ${MYSQL_PORT:-3306}
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-100M}
    networks:
      - modx-network
    ports:
      - 8090:80

networks:
  modx-network:
    driver: bridge

volumes:
  mysql-data:
